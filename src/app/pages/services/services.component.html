<div class="page" id="services">
  <h1 class="primary-text mt-3 hidden">services</h1>
  <span
    class="second-text animate__animated animate__fadeInDown animate__delay-1s"
    >{{ "services.title" | translate }}</span
  >
  <div class="row mb-5 animate__animated animate__backInRight">
    <div class="col-md-4 col-lg-4 col-sm-12">
      <p class="primary-text mt-3 lh-40">{{ "services.p1" | translate }}</p>
    </div>
    <div class="mt-3 col-md-8 col-md-8 col-sm-12">
      <p class="second-text fz-30 lh-40">{{ "services.p2" | translate }}</p>
    </div>
  </div>
  <div
    class="card-container d-flex justify-content-start flex-wrap mt-5 animate__animated animate__backInLeft animate__delay-2s"
  >
    <div class="ng-cont" *ngFor="let item of services">
      <div
        [class.maxWidth_350]="item.showDetails"
        class="card m-2 text-center box-shadow"
        (mouseover)="showServiceDetails(item.id)"
         (mouseout)="hideServiceDetails(item.id)"
      >
        <ng-container *ngIf="!item.showDetails">
          <div class="w-100">
            <img [src]="item?.image" width="50" alt="" />
          </div>
          <span> {{ item?.name | translate }}</span>
        </ng-container>
        <ng-container *ngIf="item.showDetails">
          <div class="w-100">
            <img [src]="item?.image" width="50" alt="" />
          </div>
          <div class="mt-2"[class]="currentLang=='en'?'text-start':'text-end'">
            <div class="" *ngFor="let details of item.details">
                  <p *ngIf="details.id==0" class="bold">{{details.name|translate}}</p>
                  <div class="d-flex justify-content-start">
                    <p  *ngIf="details.id>0">{{details.name|translate}}</p>
                  </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
